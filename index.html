<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VEX-XS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Pantalla de carga -->
<div id="boot-screen">
  <h1 id="logo">VEX-XS</h1>
</div>

<!-- Pantalla de bloqueo -->
<div id="lock-screen" class="hidden">
  <div id="lock-time">12:00</div>
  <div id="lock-date">Martes, 3 de Septiembre</div>
  <div id="gesture-bar"></div>
</div>

<!-- Pantalla de inicio -->
<div id="home-screen" class="hidden">
  <div id="widget-clima"><span>☀️ 26° – Soleado</span></div>
  <div id="dock">
    <img src="icon-phone.png" alt="Teléfono">
    <img src="icon-gallery.png" alt="Galería">
    <img src="icon-notes.png" alt="Notas">
    <img src="icon-messages.png" alt="Mensajes">
    <img src="icon-browser.png" alt="Navegador">
  </div>
  <div id="gesture-bar"></div>
</div>

<script src="gestos.js"></script>
<script src="animaciones.js"></script>
<script src="clima.js"></script>
<script src="config.js"></script>
<script src="hora.js"></script>
<script src="sonido_vibracion.js"></script>

</body>
</html>
