<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VXS Beta móvil</title><link rel="stylesheet" href="css/styles.css"></head><body>
<div class="phone-frame" id="phoneFrame">
  <div id="boot" class="boot"><div class="logo">VXS <span class="ver">v1‑beta</span></div><div class="dots">● ● ●</div></div>
  <main id="homeRoot" class="home-root">
    <section id="lockScreen" class="lock-screen">
      <div class="topbar"><span id="timeLock">--:--</span></div>
      <div class="center"><div class="bigTime" id="bigTime">--:--</div><div class="hint">Desliza hacia arriba para desbloquear</div></div>
      <div class="bottom-hint">Mantén pulsado el marco para apagar</div>
    </section>
    <section id="homeScreen" class="home-screen hidden">
      <header class="status"><div class="status-left">VXS • Beta</div><div class="status-right" id="statusTime">--:--</div></header>
      <section class="weather-card"><div class="w-left"><div class="w-temp" id="wTemp">26°</div><div class="w-city" id="wCity">Asunción</div></div><div class="w-right"><div class="w-cond">Parcial nublado</div></div></section>
      <section class="apps-grid" id="appsGrid">
        <button class="app-tile" data-app="phone" data-pos="left"><img src="assets/icons/phone.svg" alt=""><span>Teléfono</span></button>
        <button class="app-tile" data-app="gallery" data-pos="center"><img src="assets/icons/gallery.svg" alt=""><span>Galería</span></button>
        <button class="app-tile" data-app="notes" data-pos="right"><img src="assets/icons/notes.svg" alt=""><span>Notas</span></button>
        <button class="app-tile" data-app="messages" data-pos="left"><img src="assets/icons/messages.svg" alt=""><span>Mensajes</span></button>
        <button class="app-tile" data-app="browser" data-pos="right"><img src="assets/icons/browser.svg" alt=""><span>Navegador</span></button>
      </section>
      <nav class="favorites-bar">
        <button class="fav" data-app="phone"><img src="assets/icons/phone.svg" alt=""></button>
        <button class="fav" data-app="gallery"><img src="assets/icons/gallery.svg" alt=""></button>
        <button class="fav" data-app="notes"><img src="assets/icons/notes.svg" alt=""></button>
        <button class="fav" data-app="messages"><img src="assets/icons/messages.svg" alt=""></button>
        <button class="fav" data-app="browser"><img src="assets/icons/browser.svg" alt=""></button>
      </nav>
      <div class="gesture-bar"><div class="pill"></div></div>
    </section>
  </main>
  <section id="appView" class="app-view" aria-hidden="true"><header class="app-topbar"><button id="btnBack" class="btn back">◀</button><div class="app-title" id="appTitle">—</div><button id="btnSettings" class="btn settings">⚙</button></header><div class="app-content" id="appContent"></div><div class="gesture-bar in-app"><div class="pill"></div></div></section>
  <div id="powerOverlay" class="power-overlay hidden"><div class="power-card"><div class="power-text">Teléfono apagado</div><div class="fingerprint" id="fingerprint">●</div><div class="power-hint">Toca la huella para encender</div></div></div>
</div>
<div id="settingsModal" class="modal hidden"><div class="modal-card"><h3>Configuración</h3><label>Velocidad de animaciones:<select id="speedSel"><option value="0.5">x0.5</option><option value="1" selected>x1</option><option value="1.5">x1.5</option><option value="2">x2</option></select></label><label>Sonidos:<select id="soundSel"><option value="off">Off</option><option value="on" selected>On</option></select></label><label>Fondo de pantalla:<select id="wallSel"><option value="default">Default</option><option value="blue">Blue</option><option value="city">City</option></select></label><div class="modal-actions"><button id="saveSettings" class="btn">Guardar</button><button id="closeSettings" class="btn">Cerrar</button></div></div></div>
<script src="js/app.js"></script></body></html>
